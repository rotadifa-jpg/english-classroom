<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Links</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="page jungle-bg"><button class="music-toggle">🔇 Music OFF</button><button class="home-btn" data-home>🏠 Home</button><button class="back-btn" data-back>↩ Back</button>
<section class="activity-card wood-panel"><h1 class="card-title">🔗 Class Links</h1><div class="panel"><div class="controls"><input id="title" placeholder="Activity title"><input id="url" placeholder="https://..." style="min-width:300px"><select id="grade"><option>Grade 1</option><option>Grade 2</option><option>Both</option></select><button class="small-btn" id="add">Save Link</button></div><div class="link-list" id="list"></div></div></section></main><script src="js/app.js"></script><script>
let links=JSON.parse(localStorage.getItem('classLinks')||'[]'),list=document.getElementById('list');function render(){list.innerHTML=links.length?'':'<div class="status">No class links saved yet.</div>';links.forEach((s,i)=>{let d=document.createElement('div');d.className='saved-item';d.innerHTML=`<strong>🔗 ${s.title}</strong><span>${s.grade}</span><span><a class="small-btn" target="_blank" rel="noopener" href="${s.url}">OPEN</a> <button class="small-btn">Delete</button></span>`;d.querySelector('button').onclick=()=>{links.splice(i,1);localStorage.setItem('classLinks',JSON.stringify(links));render()};list.appendChild(d)})}add.onclick=()=>{let t=title.value.trim(),u=url.value.trim();if(!t||!u)return;links.push({title:t,url:u,grade:grade.value});localStorage.setItem('classLinks',JSON.stringify(links));title.value='';url.value='';render()};render();</script></body></html>
