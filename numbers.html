<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Numbers</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="page jungle-bg"><button class="music-toggle">🔇 Music OFF</button><button class="home-btn" data-home>🏠 Home</button><button class="back-btn" data-back>↩ Back</button>
<section class="activity-card wood-panel"><h1 class="card-title">🔢 Numbers 1–20</h1><div class="panel"><div class="controls"><button class="small-btn" id="practice">Practice</button><button class="small-btn" id="listen">Listen & Click</button></div><div class="status" id="status">Click a speaker to hear a number.</div><div class="number-grid" id="nums"></div></div></section></main><script src="js/app.js"></script><script>
const nums=document.getElementById('nums'),st=document.getElementById('status');for(let i=1;i<=20;i++){let d=document.createElement('div');d.className='number-cell';let b=document.createElement('button');b.className='number-btn';b.textContent=i;b.onclick=()=>{if(window.answer){if(i===window.answer){st.textContent='🎉 Great Job!';SFX.success();setTimeout(newRound,600)}else{st.textContent='Try Again!';SFX.try()}}};let s=document.createElement('button');s.className='speaker';s.dataset.speak=String(i);s.textContent='🔊';d.append(b,s);nums.appendChild(d)}function newRound(){window.answer=1+Math.floor(Math.random()*20);st.innerHTML='🔊 Listen: click the speaker, then choose the number.';window.speak=window.speak;document.querySelectorAll('.speaker').forEach(s=>s.onclick=()=>{window.speak(String(window.answer));SFX.click()})}document.getElementById('practice').onclick=()=>{window.answer=null;st.textContent='Practice mode: choose any number and use its speaker.'};document.getElementById('listen').onclick=newRound;</script></body></html>
