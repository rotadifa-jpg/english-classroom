<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>White Board</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="page jungle-bg"><button class="music-toggle">🔇 Music OFF</button><button class="home-btn" data-home>🏠 Home</button><button class="back-btn" data-back>↩ Back</button>
<section class="activity-card wood-panel"><h1 class="card-title">📝 White Board</h1><div class="panel"><div class="controls"><input type="color" id="color" value="#222222"><input type="range" id="size" min="2" max="30" value="6"><button class="small-btn" id="eraser">Eraser</button><button class="small-btn" id="clear">Clear</button><button class="small-btn" id="save">Save</button></div><canvas class="whiteboard" id="board" width="1200" height="650"></canvas></div></section></main><script src="js/app.js"></script><script>
const b=document.getElementById('board'),c=b.getContext('2d');let down=false,erase=false;function pos(e){let r=b.getBoundingClientRect();return{x:(e.clientX-r.left)*b.width/r.width,y:(e.clientY-r.top)*b.height/r.height}}b.addEventListener('pointerdown',e=>{down=true;let p=pos(e);c.beginPath();c.moveTo(p.x,p.y)});b.addEventListener('pointermove',e=>{if(!down)return;let p=pos(e);c.strokeStyle=erase?'#fff':color.value;c.lineWidth=size.value;c.lineCap='round';c.lineTo(p.x,p.y);c.stroke()});window.addEventListener('pointerup',()=>down=false);eraser.onclick=()=>erase=!erase;clear.onclick=()=>c.clearRect(0,0,b.width,b.height);save.onclick=()=>{let a=document.createElement('a');a.download='english-class-whiteboard.png';a.href=b.toDataURL();a.click()};</script></body></html>
