<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>White Board | English Class</title><link rel="stylesheet" href="../css/style.css"></head><body class="jungle-page">
<header class="topbar"><button class="wood-mini" data-home>🏠 Home</button><button class="wood-mini" data-back>↩ Back</button><button class="icon-btn" data-music-toggle>🎵 Music <span data-music-state>OFF</span></button></header>
<main class="page-wrap"><section class="wood-sign compact"><h1>WHITE BOARD</h1><p>Write or draw together.</p></section>
<div class="board-tools"><button class="soft-btn" data-tool="pen">✏️ Pen</button><button class="soft-btn" data-tool="eraser">🧽 Eraser</button><label>Size <input id="brushSize" type="range" min="2" max="30" value="6"></label><input id="brushColor" type="color" value="#163c22"><button class="soft-btn" id="undoBoard">↩ Undo</button><button class="soft-btn" id="clearBoard">🗑 Clear</button><button class="wood-btn" id="saveBoard">💾 Save</button></div>
<canvas id="whiteboard"></canvas></main><script src="../js/app.js"></script><script src="../js/activities.js"></script></body></html>
