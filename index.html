<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Class</title><link rel="stylesheet" href="style.css"></head><body class="home"><img src="homepage.png" class="bg" alt="English Class"><button id="sound" class="sound">🔊 Sound ON</button><a class="learn" href="activity.html">🌟 LET'S LEARN ENGLISH! 🌟</a><script>let on=localStorage.getItem('sound')!=='off';const b=document.getElementById('sound');function draw(){b.textContent=on?'🔊 Sound ON':'🔇 Sound OFF';b.classList.toggle('off',!on)}function say(t){if(on&&speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u)}}b.onclick=()=>{on=!on;localStorage.setItem('sound',on?'on':'off');draw();if(on)say('Sound is on')};document.querySelector('.learn').onclick=()=>say("Let's learn English!");draw();</script></body></html>
