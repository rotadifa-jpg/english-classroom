<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Class 🌿</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
  <main class="scene">
    <img class="scene-bg" src="homepage.png" alt="English Class jungle classroom">

    <section class="home-content" aria-label="English classroom">
      <div class="welcome-pill">🌟 LET'S LEARN ENGLISH! 🌟</div>

      <div class="navigation">
        <a class="nav-button orange" href="spinner.html">
          <span class="emoji">🎡</span>
          <span>Word Spinner</span>
        </a>
        <a class="nav-button green" href="#activities">
          <span class="emoji">📚</span>
          <span>Activities</span>
        </a>
        <a class="nav-button blue" href="#teacher">
          <span class="emoji">👩‍🏫</span>
          <span>Teacher's Corner</span>
        </a>
      </div>
    </section>
  </main>

  <section class="below-scene" id="activities">
    <div class="info-card">
      <span>🦋</span>
      <div>
        <h2>Welcome, explorers!</h2>
        <p>Choose a tool above and let's practice English together.</p>
      </div>
    </div>
    <div class="info-card" id="teacher">
      <span>🐻</span>
      <div>
        <h2>Our classroom rules</h2>
        <p>Be kind • Try your best • Speak English • Have fun!</p>
      </div>
    </div>
  </section>

  <footer>Made with ❤️ for young English learners</footer>

</html>
