<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="page jungle-bg"><button class="music-toggle">🔇 Music OFF</button><button class="home-btn" data-home>🏠 Home</button><button class="back-btn" data-back>↩ Back</button>
<section class="activity-card wood-panel"><h1 class="card-title">🌦️ Weather Adventure</h1><div class="panel"><div class="status" id="status">Grade 1: choose a weather word. Grade 2: build the sentence.</div><div class="weather-grid" id="weather"></div><div class="controls"><button class="speaker" id="say" data-speak="Sunny">🔊</button><button class="small-btn" id="check">Correct</button></div></div></section></main><script src="js/app.js"></script><script>
const w=[['☀️','Sunny'],['🌧️','Rainy'],['☁️','Cloudy'],['💨','Windy'],['⛈️','Stormy'],['❄️','Snowy']],box=document.getElementById('weather'),st=document.getElementById('status');let selected='Sunny';w.forEach(([i,n])=>{let b=document.createElement('button');b.className='weather-card';b.innerHTML=i+' '+n;b.onclick=()=>{selected=n;document.getElementById('say').dataset.speak=n;st.textContent='You chose '+n+'. Click the speaker to hear it.'};box.appendChild(b)});document.getElementById('check').onclick=()=>{st.textContent='🎉 Great Job! Today is a '+selected.toLowerCase()+' day.';SFX.success()};</script></body></html>
