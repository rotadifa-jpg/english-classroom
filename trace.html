<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trace</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="page jungle-bg"><button class="music-toggle">🔇 Music OFF</button><button class="home-btn" data-home>🏠 Home</button><button class="back-btn" data-back>↩ Back</button>
<section class="activity-card wood-panel"><h1 class="card-title">✍️ Trace the Letter</h1><div class="panel trace-area"><div class="controls"><button class="small-btn" id="random">Random Letter</button><button class="speaker" id="say" data-speak="A">🔊</button><button class="small-btn" id="clear">Try Again</button></div><div class="trace-letter" id="letter">A</div><canvas class="trace-canvas" id="canvas" width="900" height="300"></canvas><div class="status" id="status">Trace over the letter with your finger or mouse.</div></div></section></main>
<script src="js/app.js"></script><script>
const cv=document.getElementById('canvas'),ctx=cv.getContext('2d'),st=document.getElementById('status');let draw=false,count=0;function guide(){ctx.clearRect(0,0,cv.width,cv.height);ctx.setLineDash([10,12]);ctx.strokeStyle='#d9c48c';ctx.lineWidth=5;ctx.font='800 190px Fredoka';ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeText(document.getElementById('letter').textContent,450,155);ctx.setLineDash([])}function pos(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}cv.addEventListener('pointerdown',e=>{draw=true;count=0;ctx.beginPath();let p=pos(e);ctx.moveTo(p.x,p.y)});cv.addEventListener('pointermove',e=>{if(!draw)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#e85e2d';ctx.lineWidth=10;ctx.lineCap='round';ctx.stroke();count++;if(count>35){st.textContent='🎉 Great Job!';st.className='status success';SFX.success();draw=false}});window.addEventListener('pointerup',()=>draw=false);function rnd(){let l=String.fromCharCode(65+Math.floor(Math.random()*26));document.getElementById('letter').textContent=l;document.getElementById('say').dataset.speak=l;st.textContent='Trace '+l;st.className='status';guide()}document.getElementById('random').onclick=rnd;document.getElementById('clear').onclick=guide;guide();</script></body></html>
