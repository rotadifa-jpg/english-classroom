<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letter Hunt</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="page jungle-bg"><button class="music-toggle">🔇 Music OFF</button><button class="home-btn" data-home>🏠 Home</button><button class="back-btn" data-back>↩ Back</button>
<section class="activity-card wood-panel"><h1 class="card-title">🔎 Letter Hunt</h1><div class="panel"><div class="controls"><button class="speaker" id="hear" data-speak="A">🔊</button><button class="small-btn" id="new">New Letter</button></div><div class="status" id="target">Find A</div><div class="letter-grid" id="letters"></div></div></section></main>
<script src="js/app.js"></script><script>
let target='A';const box=document.getElementById('letters');function newRound(){target=String.fromCharCode(65+Math.floor(Math.random()*26));document.getElementById('hear').dataset.speak=target;document.getElementById('target').textContent='Find '+target;box.innerHTML='';let arr=[target,target,target,target,...Array.from({length:16},()=>String.fromCharCode(65+Math.floor(Math.random()*26)))];arr.sort(()=>Math.random()-.5);arr.forEach(l=>{let b=document.createElement('button');b.className='number-btn';b.textContent=l;b.onclick=()=>{if(l===target){b.classList.add('matched');document.getElementById('target').innerHTML='🎉 Great Job!';SFX.success();setTimeout(newRound,700)}else{document.getElementById('target').innerHTML='Try Again!';SFX.try()}};box.appendChild(b)})}document.getElementById('new').onclick=newRound;newRound();</script></body></html>
