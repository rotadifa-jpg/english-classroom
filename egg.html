<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complete the Egg</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="page jungle-bg"><button class="music-toggle">🔇 Music OFF</button><button class="home-btn" data-home>🏠 Home</button><button class="back-btn" data-back>↩ Back</button>
<section class="activity-card wood-panel"><h1 class="card-title">🥚 Complete the Egg</h1><div class="panel"><div class="status" id="status">Drag the correct letter into the empty egg.</div><div class="sequence" id="seq"></div><div class="tray" id="tray"></div><div class="controls"><button class="small-btn" id="check">Correct / Check</button><button class="small-btn" id="new">New Sequence</button></div></div></section></main><script src="js/app.js"></script><script>
let answer='C';const seq=document.getElementById('seq'),tray=document.getElementById('tray'),st=document.getElementById('status');function build(){let start=65+Math.floor(Math.random()*20);answer=String.fromCharCode(start+2);seq.innerHTML='';tray.innerHTML='';[0,1,2,3,4].forEach(i=>{let e=document.createElement('div');e.className='egg-slot';e.dataset.i=i;e.textContent=i===2?'_':String.fromCharCode(start+i);seq.appendChild(e)});[answer,String.fromCharCode(start+1),String.fromCharCode(start+3),String.fromCharCode(start+4)].sort(()=>Math.random()-.5).forEach(l=>{let b=document.createElement('div');b.className='egg-letter';b.draggable=true;b.textContent=l;b.ondragstart=e=>e.dataTransfer.setData('text',l);tray.appendChild(b)});let slot=seq.children[2];slot.ondragover=e=>e.preventDefault();slot.ondrop=e=>{slot.textContent=e.dataTransfer.getData('text');slot.dataset.answer=e.dataTransfer.getData('text')}}document.getElementById('check').onclick=()=>{let ok=seq.children[2].textContent===answer;if(ok){st.innerHTML='🦜 GREAT JOB! 🎉';st.className='status success';SFX.success()}else{st.textContent='Try Again!';st.className='status try';SFX.try()}};document.getElementById('new').onclick=build;build();</script></body></html>
