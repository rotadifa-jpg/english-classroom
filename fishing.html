<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letter Fishing</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="page jungle-bg"><button class="music-toggle">🔇 Music OFF</button><button class="home-btn" data-home>🏠 Home</button><button class="back-btn" data-back>↩ Back</button>
<section class="activity-card wood-panel"><h1 class="card-title">🐟 Letter Fishing</h1><div class="panel"><div class="controls"><input id="practice" value="B,D,P,Q" aria-label="Practice letters"><button class="small-btn" id="new">New Pond</button></div><div class="status" id="status">Catch a fish and say its letter!</div><div class="fish-grid" id="fish"></div><div class="controls"><button class="small-btn" id="correct">Correct ✓</button><button class="small-btn" id="wrong">Try Again</button></div></div></section></main><script src="js/app.js"></script><script>
const fish=document.getElementById('fish'),st=document.getElementById('status');function pond(){fish.innerHTML='';let chars=(document.getElementById('practice').value.toUpperCase().replace(/[^A-Z]/g,'')||'BDPQ').split('');for(let i=0;i<24;i++){let l=chars[Math.floor(Math.random()*chars.length)];let b=document.createElement('button');b.className='fish';b.innerHTML=(i%3===0?'🐠':i%3===1?'🐟':'🐡')+'<span>'+l+'</span>';b.onclick=()=>{st.textContent='You caught '+l+'! Say it aloud, then ask your teacher to check.';SFX.splash()};fish.appendChild(b)}}document.getElementById('new').onclick=pond;document.getElementById('correct').onclick=()=>{st.textContent='🎉 Great Job!';SFX.success()};document.getElementById('wrong').onclick=()=>{st.textContent='Try Again!';SFX.try()};pond();</script></body></html>
