<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Spinner</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="page jungle-bg"><button class="music-toggle">🔇 Music OFF</button><button class="home-btn" data-home>🏠 Home</button><button class="back-btn" data-back>↩ Back</button>
<section class="activity-card wood-panel"><h1 class="card-title">🎨 Color Spinner</h1><div class="panel"><div class="controls" id="checks"></div><div class="wheel-box"><div class="pointer">🔻</div><canvas id="wheel" width="520" height="520"></canvas><div><button class="cta" id="spin">SPIN</button><div class="status" id="result">Choose colors, then spin!</div><button class="speaker" id="say" data-speak="">🔊</button></div></div></div></section></main><script src="js/app.js"></script><script>
const cs=[['Red','#ef3b2d'],['Blue','#2587d8'],['Yellow','#ffd34d'],['Purple','#8d58c7'],['Green','#45a447'],['Orange','#f28c28'],['Black','#222'],['White','#fff'],['Brown','#8a5534'],['Pink','#ed79a8'],['Gold','#d8a625'],['Silver','#aeb8c2']];const checks=document.getElementById('checks');cs.forEach(([n])=>checks.innerHTML+=`<label><input type="checkbox" value="${n}" checked> ${n}</label>`);const c=document.getElementById('wheel'),x=c.getContext('2d');function selected(){return [...checks.querySelectorAll('input:checked')].map(i=>i.value)}function draw(){let a=selected();x.clearRect(0,0,520,520);let n=a.length||1;for(let i=0;i<n;i++){let s=i*2*Math.PI/n,e=(i+1)*2*Math.PI/n, col=cs.find(v=>v[0]===a[i])[1];x.beginPath();x.moveTo(260,260);x.arc(260,260,250,s,e);x.fillStyle=col;x.fill();x.strokeStyle='#6a351a';x.lineWidth=3;x.stroke();x.save();x.translate(260,260);x.rotate((s+e)/2);x.textAlign='right';x.fillStyle=(col==='#fff'||col==='#ffd34d'||col==='#d8a625')?'#5a351d':'#fff';x.font='800 19px Fredoka';x.fillText(a[i],225,7);x.restore()}}draw();checks.addEventListener('change',draw);document.getElementById('spin').onclick=()=>{let a=selected();if(!a.length)return;let v=a[Math.floor(Math.random()*a.length)];SFX.spin();document.getElementById('result').textContent='🎉 '+v+'!';document.getElementById('say').dataset.speak=v;SFX.success()};</script></body></html>
