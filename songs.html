<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Songs | English Class</title><link rel="stylesheet" href="../css/style.css"></head><body class="jungle-page">
<header class="topbar"><button class="wood-mini" data-home>🏠 Home</button><button class="wood-mini" data-back>↩ Back</button><button class="icon-btn" data-music-toggle>🎵 Music <span data-music-state>OFF</span></button></header>
<main class="page-wrap"><section class="wood-sign compact"><h1>ENGLISH CLASS SONGS</h1><p>Teacher can save learning songs and links.</p></section>
<section class="teacher-layout"><div><h2>Song Library</h2><div id="songList" class="resource-list"></div></div>
<aside class="editor-panel"><h2>Add / Edit Song</h2><label>Song Title<input id="songTitle" placeholder="e.g. ABC Song"></label><label>YouTube Link<input id="songUrl" placeholder="https://www.youtube.com/..."></label><label>Grade<select id="songGrade"><option>Grade 1</option><option>Grade 2</option><option>Both</option></select></label><button class="wood-btn" id="saveSong">SAVE SONG</button></aside></section></main>
<script src="../js/app.js"></script><script src="../js/activities.js"></script></body></html>
