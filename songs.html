<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Song Library</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="page jungle-bg"><button class="music-toggle">🔇 Music OFF</button><button class="home-btn" data-home>🏠 Home</button><button class="back-btn" data-back>↩ Back</button>
<section class="activity-card wood-panel"><h1 class="card-title">🎵 English Class Songs</h1><div class="panel"><div class="controls"><input id="title" placeholder="Song title"><input id="url" placeholder="YouTube link" style="min-width:300px"><select id="grade"><option>Grade 1</option><option>Grade 2</option><option>Both</option></select><button class="small-btn" id="add">Save Song</button></div><div class="song-list" id="list"></div></div></section></main><script src="js/app.js"></script><script>
let songs=JSON.parse(localStorage.getItem('songs')||'[]'),list=document.getElementById('list');function render(){list.innerHTML=songs.length?'':'<div class="status">No songs saved yet.</div>';songs.forEach((s,i)=>{let d=document.createElement('div');d.className='saved-item';d.innerHTML=`<strong>🎵 ${s.title}</strong><span>${s.grade}</span><span><a class="small-btn" target="_blank" rel="noopener" href="${s.url}">OPEN</a> <button class="small-btn" data-i="${i}">Delete</button></span>`;d.querySelector('button').onclick=()=>{songs.splice(i,1);localStorage.setItem('songs',JSON.stringify(songs));render()};list.appendChild(d)})}document.getElementById('add').onclick=()=>{let t=title.value.trim(),u=url.value.trim();if(!t||!u)return;songs.push({title:t,url:u,grade:grade.value});localStorage.setItem('songs',JSON.stringify(songs));title.value='';url.value='';render()};render();</script></body></html>
