<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Game</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="page jungle-bg"><button class="music-toggle">🔇 Music OFF</button><button class="home-btn" data-home>🏠 Home</button><button class="back-btn" data-back>↩ Back</button>
<section class="activity-card wood-panel"><h1 class="card-title">🃏 Uppercase & Lowercase Match</h1><div class="panel"><div class="status" id="status">Find matching pairs.</div><div class="cards" id="cards"></div></div></section></main><script src="js/app.js"></script><script>
const vals=['A','a','B','b','C','c','D','d'];let first=null,lock=false,matched=0;const box=document.getElementById('cards');vals.sort(()=>Math.random()-.5);vals.forEach(v=>{let b=document.createElement('button');b.className='memory-card';b.dataset.v=v;b.textContent=v;b.onclick=()=>flip(b);box.appendChild(b)});function flip(b){if(lock||b.classList.contains('open')||b.classList.contains('matched'))return;b.classList.add('open');SFX.click();if(!first){first=b;return}lock=true;if(first.dataset.v.toLowerCase()===b.dataset.v.toLowerCase()&&first.dataset.v!==b.dataset.v){first.classList.add('matched');b.classList.add('matched');matched++;SFX.success();document.getElementById('status').textContent=matched===4?'🎉 Excellent! You matched them all!':'Great Match!';lock=false;first=null}else{SFX.try();setTimeout(()=>{first.classList.remove('open');b.classList.remove('open');lock=false;first=null},700)}}</script></body></html>
