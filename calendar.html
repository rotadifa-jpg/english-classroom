<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="page jungle-bg"><button class="music-toggle">🔇 Music OFF</button><button class="home-btn" data-home>🏠 Home</button><button class="back-btn" data-back>↩ Back</button>
<section class="activity-card wood-panel"><h1 class="card-title">📅 Today's Calendar</h1><div class="panel"><div class="calendar-row"><div class="drop" id="month">MONTH</div><div class="drop" id="day">DAY</div><div class="drop" id="date">DATE</div></div><div class="tray" id="tray"></div><div class="controls"><button class="small-btn" id="new">New Calendar</button><button class="small-btn" id="check">Correct</button><button class="speaker" id="say" data-speak="">🔊</button></div><div class="status" id="status">Drag one tile to each box.</div></div></section></main><script src="js/app.js"></script><script>
const months=['January','February','March','April','May','June','July','August','September','October','November','December'],days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];let vals={month:'',day:'',date:''},tray=document.getElementById('tray');function build(){vals={month:'',day:'',date:''};['month','day','date'].forEach(k=>document.getElementById(k).textContent=k.toUpperCase());tray.innerHTML='';let m=months[Math.floor(Math.random()*12)],d=days[Math.floor(Math.random()*7)],dt=1+Math.floor(Math.random()*28);[m,d,String(dt)].forEach(v=>{let b=document.createElement('div');b.className='egg-letter';b.draggable=true;b.textContent=v;b.ondragstart=e=>e.dataTransfer.setData('text',v);tray.appendChild(b)});[...tray.children].forEach(b=>{b.ondragend=()=>{}});['month','day','date'].forEach(k=>{let z=document.getElementById(k);z.ondragover=e=>e.preventDefault();z.ondrop=e=>{let v=e.dataTransfer.getData('text');z.textContent=v;vals[k]=v}})}document.getElementById('check').onclick=()=>{if(vals.month&&vals.day&&vals.date){let s=`Today is ${vals.day}, ${vals.month} ${vals.date}.`;document.getElementById('say').dataset.speak=s;document.getElementById('status').textContent='🎉 Great Job! '+s;SFX.success()}else{document.getElementById('status').textContent='Try Again! Fill all three boxes.';SFX.try()}};document.getElementById('new').onclick=build;build();</script></body></html>
