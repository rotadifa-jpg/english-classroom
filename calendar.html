<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendar | English Class</title><link rel="stylesheet" href="../css/style.css"></head><body class="jungle-page">
<header class="topbar"><button class="wood-mini" data-home>🏠 Home</button><button class="wood-mini" data-back>↩ Back</button><button class="icon-btn" data-music-toggle>🎵 Music <span data-music-state>OFF</span></button></header>
<main class="page-wrap"><section class="wood-sign compact"><h1>TODAY'S CALENDAR</h1><p>Build the calendar and check it.</p></section>
<div class="calendar-board"><div class="calendar-slots"><div><span>MONTH</span><strong id="monthSlot">Drop here</strong></div><div><span>DAY</span><strong id="daySlot">Drop here</strong></div><div><span>DATE</span><strong id="dateSlot">Drop here</strong></div></div>
<div class="drag-bank" id="calendarBank"></div><div class="action-row"><button class="wood-btn" id="checkCalendar">CHECK</button><button class="soft-btn" id="newCalendar">NEW CALENDAR</button><button class="speaker-btn" id="calendarSpeaker">🔊</button></div><div id="calendarFeedback" class="result-card"></div></div></main>
<script src="../js/app.js"></script><script src="../js/activities.js"></script></body></html>
