<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Spinner 🎡</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #6d9c5e; overflow-x: hidden; }

    .activity-scene {
      position: relative;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
    }

    .activity-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .activity-board {
      position: absolute;
      left: 50%;
      top: 19%;
      transform: translateX(-50%);
      width: min(62%, 1180px);
      height: 55%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .activity-title {
      margin: 0 0 10px;
      color: #fff3b0;
      font-family: "Baloo 2", cursive;
      font-size: clamp(2rem, 5vw, 4.3rem);
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 5px 0 #6c3d16;
      text-align: center;
    }

    .pointer {
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 32px solid #5c3518;
      position: relative;
      z-index: 5;
      margin-bottom: -4px;
    }

    .wheel {
      width: min(270px, 30vw);
      aspect-ratio: 1;
      border: 9px solid #fff7d7;
      border-radius: 50%;
      box-shadow: 0 10px 22px rgba(75,42,15,.3);
      background: conic-gradient(
        #ef7b38 0deg 45deg,
        #f6c84c 45deg 90deg,
        #70a85b 90deg 135deg,
        #4d9bb9 135deg 180deg,
        #ed8e4b 180deg 225deg,
        #7bbd76 225deg 270deg,
        #f2c34a 270deg 315deg,
        #5b9eb9 315deg 360deg
      );
      display: grid;
      place-items: center;
      transition: transform 1.4s cubic-bezier(.17,.67,.18,1);
    }

    .wheel::after {
      content: "🎡";
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      background: #fff9df;
      border: 5px solid #6b411c;
      border-radius: 50%;
      font-size: 31px;
      box-shadow: 0 3px 10px rgba(0,0,0,.2);
    }

    .result {
      margin-top: 12px;
      min-width: min(330px, 70vw);
      padding: 8px 22px 10px;
      text-align: center;
      background: rgba(255,250,222,.94);
      border: 4px solid #9c5b20;
      border-radius: 18px;
      box-shadow: 0 5px 0 #6d3b17;
    }

    .result-label {
      margin: 0;
      color: #8c5a2b;
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .16em;
    }

    #word {
      margin: 0;
      color: #5b3519;
      font-family: "Baloo 2", cursive;
      font-size: 2.2rem;
      line-height: 1;
    }

    #spinButton {
      margin-top: 13px;
      border: 4px solid white;
      border-radius: 18px;
      padding: 10px 28px;
      background: #f26b32;
      color: white;
      font: 800 1.2rem "Baloo 2", cursive;
      box-shadow: 0 5px 0 #a74420;
      cursor: pointer;
      transition: transform .15s ease;
    }

    #spinButton:hover { transform: translateY(-3px); }
    #spinButton:disabled { opacity: .7; cursor: wait; }

    .back-button {
      position: absolute;
      z-index: 10;
      left: 3%;
      top: 4%;
      padding: 9px 16px;
      border: 3px solid white;
      border-radius: 16px;
      background: #4e8f50;
      color: white;
      text-decoration: none;
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      box-shadow: 0 4px 0 #315d34;
    }

    @media (max-width: 760px) {
      .activity-board { top: 18%; width: 75%; height: 60%; }
      .wheel { width: 200px; }
      .result { min-width: 230px; }
      #word { font-size: 1.7rem; }
      #spinButton { padding: 7px 20px; font-size: 1rem; }
      .activity-title { font-size: 2.1rem; }
    }
  </style>
</head>
<body>
  <main class="activity-scene">
    <img class="activity-bg" src="activitypage.png" alt="Jungle classroom activity board">
    <a class="back-button" href="index.html">← Classroom</a>

    <section class="activity-board">
      <h1 class="activity-title">WORD SPINNER</h1>
      <div class="pointer"></div>
      <div class="wheel" id="wheel"></div>

      <div class="result">
        <p class="result-label">YOUR WORD</p>
        <h2 id="word">Ready?</h2>
      </div>

      <button id="spinButton" onclick="spin()">🎡 SPIN!</button>
    </section>
  </main>

  <script>
    const words = [
      "cat", "dog", "apple", "happy",
      "school", "friend", "book", "sun",
      "teacher", "blue", "run", "jump"
    ];

    const wheel = document.getElementById("wheel");
    const word = document.getElementById("word");
    const button = document.getElementById("spinButton");
    let rotation = 0;

    function spin() {
      button.disabled = true;
      word.textContent = "Spinning...";
      rotation += 1440 + Math.floor(Math.random() * 720);
      wheel.style.transform = "rotate(" + rotation + "deg)";

      setTimeout(() => {
        word.textContent = words[Math.floor(Math.random() * words.length)];
        button.disabled = false;
      }, 1450);
    }
  </script>
</body>
</html>
