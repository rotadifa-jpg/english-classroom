<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spinner | English Class</title><link rel="stylesheet" href="../css/style.css"></head><body class="jungle-page">
<header class="topbar"><button class="wood-mini" data-home>🏠 Home</button><button class="wood-mini" data-back>↩ Back</button><button class="icon-btn" data-music-toggle>🎵 Music <span data-music-state>OFF</span></button></header>
<main class="page-wrap"><section class="wood-sign compact"><h1>SPINNER</h1><p>Choose names, numbers, or practice words.</p></section>
<div class="spinner-layout"><section class="wheel-panel"><div class="wheel-wrap"><div id="spinnerWheel" class="wheel"></div><div class="pointer">★</div></div><div id="spinnerResult" class="result-card">Ready!</div>
<div class="action-row"><button class="wood-btn" id="spinBtn">SPIN!</button><button class="soft-btn" id="resetSpinner">RESET</button></div></section>
<aside class="editor-panel"><h2>Wheel Editor</h2><label>Mode<select id="spinnerMode"><option value="names">Names</option><option value="numbers">Numbers</option></select></label>
<label>Items (one per line)<textarea id="spinnerItems">Anna
Ben
Carlos
Dina
Ethan
Faye</textarea></label><button class="wood-btn" id="applySpinner">UPDATE WHEEL</button>
<p class="hint">Edit the list and update the wheel before spinning.</p></aside></div></main><script src="../js/app.js"></script><script src="../js/activities.js"></script></body></html>
