<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spinner</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="page jungle-bg"><script>document.write('<button class="music-toggle">🔇 Music OFF</button><button class="home-btn" data-home>🏠 Home</button><button class="back-btn" data-back>↩ Back</button>')</script>
<section class="activity-card wood-panel"><h1 class="card-title">🎡 Jungle Spinner</h1><div class="panel">
<div class="controls"><select id="mode"><option value="names">Names</option><option value="numbers">Numbers</option></select><button class="small-btn" id="reset">Reset</button><button class="small-btn" id="spin">SPIN!</button></div>
<div class="wheel-box"><div class="pointer">🔻</div><canvas id="wheel" width="540" height="540"></canvas><div style="width:min(360px,100%)"><label>Items (one per line)</label><textarea id="items">Alex
Mia
Leo
Sofia
Noah
Emma</textarea><div class="status" id="result">Ready!</div></div></div></div></section></main>
<script src="js/app.js"></script><script>
const c=document.getElementById('wheel'),x=c.getContext('2d'),itemsEl=document.getElementById('items'),res=document.getElementById('result');let rot=0,busy=false;
const colors=['#ef6c2f','#ffd45b','#58b957','#4bb7d8','#9b67c6','#f08c3a','#62c4a3','#e55a7a'];
function items(){return itemsEl.value.split('\\n').map(s=>s.trim()).filter(Boolean).slice(0,24)}
function draw(){const a=items(),n=a.length||1,rad=c.width/2;x.clearRect(0,0,c.width,c.height);for(let i=0;i<n;i++){let s=i*2*Math.PI/n,e=(i+1)*2*Math.PI/n;x.beginPath();x.moveTo(rad,rad);x.arc(rad,rad,rad-8,s,e);x.fillStyle=colors[i%colors.length];x.fill();x.strokeStyle='#63361b';x.lineWidth=3;x.stroke();x.save();x.translate(rad,rad);x.rotate((s+e)/2);x.textAlign='right';x.fillStyle='#fff';x.font='800 22px Fredoka';x.shadowColor='#63361b';x.shadowBlur=2;x.fillText(a[i],rad-30,8);x.restore()}x.beginPath();x.arc(rad,rad,35,0,Math.PI*2);x.fillStyle='#fff2b7';x.fill();x.strokeStyle='#63361b';x.lineWidth=5;x.stroke()}draw();
itemsEl.addEventListener('input',draw);document.getElementById('reset').onclick=()=>{rot=0;draw();res.textContent='Ready!'};document.getElementById('spin').onclick=()=>{if(busy||!items().length)return;busy=true;SFX.spin();const a=items(),n=a.length,idx=Math.floor(Math.random()*n),target=360*6+(360-(idx+.5)*360/n);rot+=target;c.style.transform=`rotate(${rot}deg)`;setTimeout(()=>{res.innerHTML='🎉 '+a[idx]+'!';SFX.success();busy=false},4200)};</script></body></html>
